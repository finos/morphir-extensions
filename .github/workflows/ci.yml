name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  # Selects the path-scoped jobs. A push to main and a manual run select all.
  changes:
    name: Select jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select from the changed paths
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "$changed"
          rust=false
          if echo "$changed" | grep -q -E '^(rust/|\.config/mise/config\.rust\.toml$|\.config/mise/tasks/rust/|\.github/workflows/|\.github/scripts/)'; then
            rust=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install_args: node npm:@fission-ai/openspec http:moonbit
          cache: true

      - name: Complete the pinned MoonBit SDK for the shared checker
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$(mise where http:moonbit)" bash -s -- "$(mise current http:moonbit)"
          mise exec -- moon update

      - name: Check OpenSpec snapshots, schema and changes
        run: |
          mise run openspec:check
          mise run openspec:validate
          mise run openspec:test

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install_args: actionlint
          cache: true

      - name: Lint GitHub Actions workflows
        run: mise exec -- actionlint

  rust:
    name: Rust checks
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_ENV: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install_args: rust wasm-tools
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: mise run rust:fmt

      - name: Clippy (host and wasm32)
        run: mise run rust:lint

      - name: Unit, golden and integration tests
        run: mise run rust:test

  wasm:
    name: Wasm guests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_ENV: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install_args: rust wasm-tools bun
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build, validate and check the imports of each guest
        run: mise run rust:wasm

      - name: Guest check (parity with the native crates and the committed claims)
        run: mise run rust:guest-check

      - name: Test the bundle script
        working-directory: .github/scripts/extension-bundle
        run: bun test

      - name: Assemble each bundle without attesting or publishing
        run: |
          set -euo pipefail
          # Short ids are lowercase letters, digits and -, so word splitting is safe.
          shorts=$(bun .github/scripts/extension-bundle/cli.ts list)
          for short in $shorts; do
            mise run rust:bundle "$short" --out "$GITHUB_WORKSPACE/dist/$short" --git-commit "$GITHUB_SHA"
          done

      - name: Upload the dry-run bundles
        uses: actions/upload-artifact@v6
        with:
          name: bundles-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 7

  avro-idl:
    name: Avro IDL
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENV: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install_args: java
          cache: true

      - name: Cache Apache Avro Tools
        uses: actions/cache@v4
        with:
          path: .morphir/cache/avro
          key: avro-tools-1.12.2

      - name: Validate the Avro IDL goldens with Apache Avro Tools
        run: mise run rust:avro-idl

  # The one check to require. It always runs and fails when a needed job failed
  # or was cancelled; a job that change selection skipped does not fail it.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [changes, openspec, actionlint, rust, wasm, avro-idl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a needed job ended with: $result"; exit 1 ;;
            esac
          done
