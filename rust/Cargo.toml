[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
authors = ["FINOS <info@finos.org>"]
license = "Apache-2.0"
repository = "https://github.com/finos/morphir-extensions"
homepage = "https://github.com/finos/morphir-extensions"

[workspace.dependencies]
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
