# Repository tooling for finos/morphir-extensions.
# Language tools for an extension live in their own mise environment, so a job
# installs only what it needs: Rust extensions use .config/mise/config.rust.toml
# (MISE_ENV=rust).

[tools]
# OpenSpec uses the same portable html-design bundle as related Morphir repos.
node = "24.14.1"
"npm:@fission-ai/openspec" = "1.14.3"
# Bundle assembly and its tests.
bun = "1.4.4"
# GitHub Actions workflow lint.
actionlint = "1.7.12"

# The shared OpenSpec snapshot checker (openspec:check, openspec:setup and
# openspec install). It is a released binary, so a MoonBit toolchain change
# cannot break it. A version bump needs `mission-control-tools openspec install`.
[tools."github:moonrockz/mission-control"]
version = "0.1.0"
version_prefix = "tools-v"

[tools."github:moonrockz/mission-control".platforms]
linux-x64 = { asset_pattern = "mission-control-tools-linux-x64.tar.gz" }
linux-arm64 = { asset_pattern = "mission-control-tools-linux-arm64.tar.gz" }
macos-arm64 = { asset_pattern = "mission-control-tools-darwin-arm64.tar.gz" }
macos-x64 = { asset_pattern = "mission-control-tools-darwin-x64.tar.gz" }
windows-x64 = { asset_pattern = "mission-control-tools-windows-x64.zip" }
# No Windows arm64 build; Windows on Arm runs the x64 build under emulation.
windows-arm64 = { asset_pattern = "mission-control-tools-windows-x64.zip" }
